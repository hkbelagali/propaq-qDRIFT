[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propaq-qdrift"
version = "0.1.0"
description = "Simple wrappers to run qDRIFT circuits with propaq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "propaq>=0.1.5",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["propaq_qdrift*"]
